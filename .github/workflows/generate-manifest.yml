name: Update portfolio

on:
  push:
    paths:
      - "assets/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "scripts/**"
      - "portfolio.json"
      - "CNAME"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/workflows/generate-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Test content generation
        run: node --test scripts/portfolio.test.cjs

      - name: Generate portfolio and prepare website files
        run: node scripts/portfolio.cjs --build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
