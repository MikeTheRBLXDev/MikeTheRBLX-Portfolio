name: Update portfolio

on:
  push:
    paths:
      - "portfolio/**"
      - "portfolio.json"
      - ".github/scripts/generate-manifest.py"
      - ".github/workflows/generate-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate portfolio manifest
        run: python3 .github/scripts/generate-manifest.py

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.json
          git diff --cached --quiet || git commit -m "chore: update portfolio manifest"
          git push
