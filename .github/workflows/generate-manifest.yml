name: Update portfolio

on:
  push:
    paths:
      - "assets/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "portfolio.json"
      - "CNAME"
      - ".github/scripts/generate-manifest.py"
      - ".github/workflows/generate-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate portfolio manifest
        run: python3 .github/scripts/generate-manifest.py

      - name: Prepare website files
        run: |
          mkdir -p _site
          cp *.html *.css *.js portfolio.json _site/
          cp -R assets _site/assets
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
