name: Update portfolio

on:
  push:
    paths:
      - "assets/**"
      - "*.html"
      - "*.css"
      - "*.js"
      - "portfolio.json"
      - "project-details.json"
      - "CNAME"
      - "sitemap.xml"
      - "robots.txt"
      - ".github/scripts/generate-manifest.py"
      - ".github/scripts/test_generate_manifest.py"
      - ".github/workflows/generate-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate portfolio manifest
        run: python3 .github/scripts/generate-manifest.py

      - name: Test content generation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Prepare website files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          destination = Path('_site')
          destination.mkdir(exist_ok=True)
          public_files = (
              'index.html', 'portfolio.html', 'contact.html', 'tos.html',
              'styles.css', 'site.js', 'portfolio.js', 'portfolio.json',
              'google9f09677e001de9f7.html', 'CNAME', 'sitemap.xml', 'robots.txt',
          )
          for filename in public_files:
              source = Path(filename)
              if source.is_file() and not source.is_symlink():
                  shutil.copy2(source, destination / filename)
          media_extensions = {
              '.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.avif',
              '.mp4', '.webm', '.ogg', '.mov', '.m4v', '.ico',
              '.woff', '.woff2', '.ttf', '.otf',
          }
          for source in Path('assets').rglob('*'):
              if (source.is_file() and not source.is_symlink()
                      and source.resolve().is_relative_to(Path('assets').resolve())
                      and source.suffix.lower() in media_extensions):
                  target = destination / source
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
