<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <link rel="icon" href="assets/NormalAssets/logo.webp">
  <link rel="stylesheet" href="styles.css">
  <title>MikeTheRBLXDev — Portfolio</title>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="noise" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="MikeTheRBLXDev home">
      <img src="assets/NormalAssets/logo.webp" alt="" class="brand-mark">
      <span class="brand-name">MikeThe<span>RBLXDev</span></span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="index.html" data-nav="about">About me</a>
      <a href="tos.html" data-nav="tos">ToS</a>
      <a href="portfolio.html" data-nav="portfolio">Portfolio</a>
      <a href="contact.html" data-nav="contact" class="nav-contact">Contact</a>
    </nav>
    <div class="header-status"><span class="status-dot"></span><span>AVAILABLE FOR WORK</span></div>
  </header>
  <main id="main-content" tabindex="-1">
    <section class="section portfolio-section page-top" id="portfolio">
      <div class="section-heading portfolio-heading">
        <div>
          <p class="eyebrow"><span>03</span> SELECTED WORK</p>
          <h1 class="page-title">The work<br><span>speaks for itself.</span></h1>
        </div>
      </div>
      <div class="portfolio-tabs" role="tablist" aria-label="Portfolio categories">
        <button class="portfolio-tab active" id="tab-scripting" data-category="scripting" role="tab" aria-controls="portfolio-content" aria-selected="true" tabindex="0">Scripting</button>
        <button class="portfolio-tab" id="tab-ui" data-category="ui" role="tab" aria-controls="portfolio-content" aria-selected="false" tabindex="-1">UI</button>
      </div>
      <div id="portfolio-content" role="tabpanel" aria-labelledby="tab-scripting" tabindex="0">
        <div id="portfolio-featured" hidden></div>
        <div id="portfolio-grid" class="portfolio-grid"></div>
        <div id="portfolio-empty" class="portfolio-empty" hidden>
          <div class="empty-icon" aria-hidden="true">&lt;/&gt;</div>
          <h3>No work uploaded yet.</h3>
          <p>Get in touch to discuss your project or ask about my work.</p>
          <a class="button" href="contact.html">Contact me <span aria-hidden="true">↗</span></a>
        </div>
      </div>
      <noscript><p class="portfolio-empty">Please enable JavaScript to browse the project previews. You can also <a href="https://www.youtube.com/@MikeTheRBLXDev">watch my demos on YouTube</a> or <a href="contact.html">contact me</a>.</p></noscript>
    </section>
  </main>
  <footer>
    <span>MIKETHERBLXDEV</span>
    <span>ROBLOX DEVELOPER · 4+ YEARS</span>
    <span>© <span id="year"></span></span>
  </footer>
  <dialog class="media-modal" id="media-modal" aria-labelledby="modal-title">
    <div class="modal-toolbar">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close" type="button" aria-label="Close preview" autofocus>×</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </dialog>
  <script src="portfolio.js" defer></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    document.querySelector('[data-nav="portfolio"]').classList.add("active");
  </script>
  <div class="copy-status" id="copy-status" role="status" aria-live="polite"></div>
  <script src="site.js" defer></script>
</body>
</html>
